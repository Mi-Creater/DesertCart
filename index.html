}

<body>

<header>User Oshani CS Team</header>

<div class="container">

<h3>Paste Data Here</h3>

<textarea id="inputData" placeholder="Paste data in this format:

SKU | I-Number | Qty
"></textarea>

<div class="stats">
    <span id="pasteQty">Total Pasted Qty: 0</span>
    <span id="resultQty">Generated Result Qty: 0</span>
</div>

<label><b>Select UOM Type:</b></label><br>

<select id="uomType">
    <option value="">-- Select --</option>
    <option value="Piece">Piece</option>
    <option value="Case">Case</option>
    <option value="Box">Box</option>
    <option value="Pallet">Pallet</option>
</select>

<br>

<button id="generateBtn" onclick="startLoading()">
    Generate Preview
</button>

<button onclick="copyReport()">Copy Report</button>

<button onclick="downloadExcel()">Download Excel</button>

<button onclick="clearAll()">Clear All Data</button>

<!-- ONLY LOADING -->
<div id="loadingBox" class="loadingBox">
    <div class="loader"></div>
    <span>Loading...</span>
</div>

<!-- Result will ALWAYS remain empty -->
<div id="output"></div>

</div>

<script>

const STORAGE_KEY = "sku_data_storage";


/* =========================
   PAGE LOAD
========================= */

window.onload = function() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (saved) {

        document.getElementById("inputData").value =
            saved;

    }

};


/* =========================
   SAVE DATA
========================= */

document.getElementById("inputData")
.addEventListener("input", function() {

    localStorage.setItem(
        STORAGE_KEY,
        this.value
    );

});


/* =========================
   GENERATE = LOADING ONLY
========================= */

function startLoading() {

    /*
     * Previous result ko remove kar do.
     */

    document.getElementById("output").innerHTML = "";

    document.getElementById("resultQty").innerText =
        "Generated Result Qty: 0";


    /*
     * Loading show.
     */

    document.getElementById("loadingBox").style.display =
        "flex";


    /*
     * Button disable.
     */

    document.getElementById("generateBtn").disabled =
        true;


    /*
     * IMPORTANT:
     *
     * Yahan koi result generation nahi hai.
     *
     * Correct format ho ya wrong format,
     * result KABHI generate nahi hoga.
     *
     * Loading continuously chalegi.
     */

}


/* =========================
   COPY REPORT
========================= */

function copyReport() {

    /*
     * Result kabhi generate nahi hota,
     * isliye copy bhi nahi hoga.
     */

    return;
}


/* =========================
   DOWNLOAD
========================= */

function downloadExcel() {

    /*
     * Result kabhi generate nahi hota,
     * isliye download bhi nahi hoga.
     */

    return;
}


/* =========================
   CLEAR ALL
========================= */

function clearAll() {

    localStorage.removeItem(STORAGE_KEY);

    document.getElementById("inputData").value =
        "";

    document.getElementById("output").innerHTML =
        "";

    document.getElementById("pasteQty").innerText =
        "Total Pasted Qty: 0";

    document.getElementById("resultQty").innerText =
        "Generated Result Qty: 0";

    document.getElementById("uomType").value =
        "";

    /*
     * Loading stop.
     */

    document.getElementById("loadingBox").style.display =
        "none";

    document.getElementById("generateBtn").disabled =
        false;

}


/* =========================
   BASIC SHORTCUT BLOCK
========================= */

document.addEventListener(
    "contextmenu",
    function(e) {

        e.preventDefault();

    }
);


document.addEventListener(
    "keydown",
    function(e) {

        /*
         * Ctrl + U
         */

        if (
            e.ctrlKey &&
            e.key.toLowerCase() === "u"
        ) {

            e.preventDefault();
            return false;

        }


        /*
         * F12
         */

        if (e.key === "F12") {

            e.preventDefault();
            return false;

        }


        /*
         * Ctrl + Shift + I
         */

        if (
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "i"
        ) {

            e.preventDefault();
            return false;

        }


        /*
         * Ctrl + Shift + J
         */

        if (
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "j"
        ) {

            e.preventDefault();
            return false;

        }


        /*
         * Ctrl + Shift + C
         */

        if (
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "c"
        ) {

            e.preventDefault();
            return false;

        }

    }
);

</script>

</body>
</html>
