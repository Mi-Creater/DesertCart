<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User M.i Creater</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
}
header {
    background: #2c3e50;
    color: white;
    padding: 3px 20px;
    text-align: right;
    font-size: 15px;
    font-weight: normal;
}
.container {
    padding: 20px;
}
textarea {
    width: 100%;
    height: 200px;
    padding: 10px;
    font-size: 14px;
}
button {
    padding: 10px 15px;
    margin: 10px 5px 10px 0;
    cursor: pointer;
    border: none;
    background: #3498db;
    color: white;
    border-radius: 4px;
}
button:hover {
    background: #2980b9;
}
.stats {
    margin-top: 10px;
}
.stats span {
    display: inline-block;
    padding: 8px 15px;
    background: #ecf0f1;
    margin-right: 10px;
    border-radius: 4px;
    font-weight: bold;
}
select {
    padding: 8px;
    margin: 10px 0;
    font-size: 14px;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background: white;
}
th, td {
    border: 1px solid #ccc;
    padding: 6px;
    font-size: 13px;
}
th {
    background: #ecf0f1;
}
</style>
</head>

<body>

<header>User Oshani CS Team</header>

<div class="container">

<h3>Paste Data Here</h3>

<textarea id="inputData" placeholder="Paste data in this format:

SKU | I-Number | Qty
"></textarea>

<div class="stats">
    <span id="pasteQty">Total Pasted Qty: 0</span>
    <span id="resultQty">Generated Result Qty: 0</span>
</div>

<!-- ✅ UOM TYPE FILTER -->
<label><b>Select UOM Type:</b></label><br>
<select id="uomType" onchange="updateUOMType()">
    <option value="">-- Select --</option>
    <option value="Piece">Piece</option>
    <option value="Case">Case</option>
    <option value="Box">Box</option>
    <option value="Pallet">Pallet</option>
</select>
<br>

<button onclick="generatePreview()">Generate Preview</button>
<button onclick="copyReport()">Copy Report</button>
<button onclick="downloadExcel()">Download Excel</button>
<button onclick="clearAll()">Clear All Data</button>

<div id="output"></div>

</div>

<script>
const STORAGE_KEY = "sku_data_storage";
let finalRows = [];
let selectedUOM = "";

window.onload = () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        document.getElementById("inputData").value = saved;
    }
};

document.getElementById("inputData").addEventListener("input", () => {
    localStorage.setItem(STORAGE_KEY, document.getElementById("inputData").value);
});

function updateUOMType() {
    selectedUOM = document.getElementById("uomType").value;
    document.getElementById("output").innerHTML = "";
    finalRows = [];
    document.getElementById("resultQty").innerText =
        "Generated Result Qty: 0";
}

function generatePreview() {
    finalRows = [];

    document.getElementById("resultQty").innerText =
        "Generated Result Qty: 0";

    document.getElementById("output").innerHTML = `
        <div style="
            margin-top:20px;
            padding:30px;
            background:#fff;
            border:3px solid #c0392b;
            border-radius:6px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
            color:#c0392b;
        ">
            ⚠️ FORMAT NOT VALID ⚠️
            <br><br>
            Your pasted data format is not valid.
            <br>
            Please check the format and paste the correct data.
            <br><br>
            No report has been generated.
        </div>
    `;
}

function renderTable() {
    document.getElementById("output").innerHTML = "";
    finalRows = [];
}

function downloadExcel() {
    return;
}

function copyReport() {
    return;
}

function clearAll() {
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById("inputData").value = "";
    document.getElementById("output").innerHTML = "";
    document.getElementById("pasteQty").innerText = "Total Pasted Qty: 0";
    document.getElementById("resultQty").innerText = "Generated Result Qty: 0";
    document.getElementById("uomType").value = "";
    selectedUOM = "";
    finalRows = [];
}
</script>

</body>
</html>
