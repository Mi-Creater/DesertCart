<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Unavailable</title>
  <style>
    body{
      margin:0;
      background:#0d1117;
      color:#c9d1d9;
      font-family:Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }
    .box{
      max-width:600px;
      padding:40px;
      border:1px solid #30363d;
      border-radius:12px;
      background:#161b22;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }
    h1{
      color:#f85149;
      margin-bottom:15px;
    }
    p{
      font-size:16px;
      line-height:1.6;
    }
    .code{
      margin-top:20px;
      background:#0d1117;
      padding:12px;
      border-radius:8px;
      color:#8b949e;
      font-family:monospace;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Site Temporarily Unavailable</h1>
    <p>
      This project is currently unavailable or has been discontinued by the owner.
    </p>

    <div class="code">
      ERROR 410 : Project No Longer Available
    </div>
  </div>
</body>
</html>
